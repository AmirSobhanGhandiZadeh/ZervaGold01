services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: zerva
      POSTGRES_USER: zerva
      POSTGRES_PASSWORD: zerva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerva -d zerva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_kyc_tiers &&
      python manage.py seed_asset_types &&
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    command: celery -A config worker --loglevel=INFO
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
    command: celery -A config beat --loglevel=INFO
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
